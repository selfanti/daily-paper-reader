name: Upstream Sync

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点（北京时间 8 点）检查更新
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}

      - name: Merge and push upstream changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"
          git config merge.ours.driver true

          git remote add upstream https://github.com/ziwenhahaha/daily-paper-reader.git
          git fetch --prune upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          git merge --no-ff upstream/main -m "$(cat <<'EOF'
          [chore] sync upstream

          Co-Authored-By: lilmortyj <781113402@qq.com>
          Co-Authored-By: xixi <3495302215@qq.com>
          Co-Authored-By: wy <345619498@qq.com>
          EOF
          )"
          git push origin HEAD:main

      - name: Explain sync failure
        if: failure()
        run: |
          echo "[Error] Upstream sync failed. Check the merge and push output above for the exact cause."
          exit 1
